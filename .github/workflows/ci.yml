name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # server/package.json requires >=20.6 for --env-file-if-exists.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: jnnce-1/server/package-lock.json

      # package-lock.json is committed, so ci gives a reproducible install.
      - name: Install
        run: npm ci
        working-directory: jnnce-1/server

      # No secrets needed: the suite sets a fake GEMINI_API_KEY itself so the
      # validation paths run without a real credential. One test deliberately
      # gets past validation and attempts the upstream call, which fails with
      # that fake key. It asserts only that validation did not reject it, so it
      # passes whether or not the runner has network egress.
      - name: Test
        run: npm test
        working-directory: jnnce-1/server

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # All frontend ES modules are loaded straight into the browser with no bundler,
      # so nothing else would catch a parse error before a user hits it.
      # --check needs the .mjs extension to treat the file as a module.
      - name: Parse frontend ES modules
        run: |
          # Main entry point
          cp jnnce-1/src/main.js "$RUNNER_TEMP/main.mjs"
          node --check "$RUNNER_TEMP/main.mjs"
          # Core modules
          cp jnnce-1/gestures.js "$RUNNER_TEMP/gestures.mjs"
          node --check "$RUNNER_TEMP/gestures.mjs"
          cp jnnce-1/src/three/scene.js "$RUNNER_TEMP/scene.mjs"
          node --check "$RUNNER_TEMP/scene.mjs"
          cp jnnce-1/src/three/models.js "$RUNNER_TEMP/models.mjs"
          node --check "$RUNNER_TEMP/models.mjs"
          cp jnnce-1/src/gestures/handlers.js "$RUNNER_TEMP/handlers.mjs"
          node --check "$RUNNER_TEMP/handlers.mjs"
          cp jnnce-1/src/gestures/mediapipe.js "$RUNNER_TEMP/mediapipe.mjs"
          node --check "$RUNNER_TEMP/mediapipe.mjs"
          cp jnnce-1/src/ui/sidebar.js "$RUNNER_TEMP/sidebar.mjs"
          node --check "$RUNNER_TEMP/sidebar.mjs"
          cp jnnce-1/src/ui/ai-chat.js "$RUNNER_TEMP/ai-chat.mjs"
          node --check "$RUNNER_TEMP/ai-chat.mjs"
          cp jnnce-1/src/multiplayer/socket.js "$RUNNER_TEMP/socket.mjs"
          node --check "$RUNNER_TEMP/socket.mjs"
          cp jnnce-1/src/recording/index.js "$RUNNER_TEMP/recording.mjs"
          node --check "$RUNNER_TEMP/recording.mjs"
          cp jnnce-1/src/ar/index.js "$RUNNER_TEMP/ar.mjs"
          node --check "$RUNNER_TEMP/ar.mjs"
          cp jnnce-1/src/errors/client.js "$RUNNER_TEMP/errors.mjs"
          node --check "$RUNNER_TEMP/errors.mjs"

      - name: Parse server entrypoint
        run: node --check jnnce-1/server/index.js

      - name: Validate bundled glTF is well-formed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('jnnce-1/scene.gltf','utf8'))"
